<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIO 2026 파트너링 스케줄</title>
<style>
:root{
  --bg:#FAF9F6; --bg-secondary:#F1EFE8; --bg-primary:#FFFFFF;
  --text-primary:#2B2A28; --text-secondary:#6F6E69; --text-tertiary:#9C9A95;
  --border-primary:#B4B2A9; --border-secondary:#D9D7CE; --border-tertiary:#E8E6DE;
  --radius-md:8px; --radius-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text-primary)}
.app{max-width:900px;margin:0 auto;padding:1.5rem 1rem}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.topbar h2{font-size:18px;font-weight:600;color:var(--text-primary);flex:1}
.sync-badge{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#1D9E75}
.sync-dot.syncing{background:#BA7517;animation:pulse 1s infinite}
.sync-dot.error{background:#D85A30}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
.stat{background:var(--bg-secondary);border-radius:var(--radius-md);padding:9px 12px}
.stat-label{font-size:11px;color:var(--text-secondary);margin-bottom:2px}
.stat-val{font-size:19px;font-weight:600;color:var(--text-primary)}
.tab-bar{display:flex;gap:3px;background:var(--bg-secondary);border-radius:var(--radius-md);padding:3px;margin-bottom:1rem}
.tab{padding:6px 12px;font-size:12px;border-radius:6px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer}
.tab.active{background:var(--bg-primary);color:var(--text-primary);font-weight:600;border:0.5px solid var(--border-tertiary)}
.day-tabs{display:flex;gap:4px;margin-bottom:1rem;flex-wrap:wrap}
.day-tab{padding:6px 16px;font-size:12px;border-radius:var(--radius-md);border:0.5px solid var(--border-secondary);background:var(--bg-primary);color:var(--text-secondary);cursor:pointer;font-weight:400}
.day-tab.active{background:var(--text-primary);color:var(--bg-primary);border-color:var(--text-primary)}
.timetable{display:flex;gap:0;border:0.5px solid var(--border-tertiary);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-primary)}
.time-col{width:56px;flex-shrink:0;border-right:0.5px solid var(--border-tertiary)}
.time-slot{height:60px;display:flex;align-items:flex-start;justify-content:flex-end;padding:4px 8px 0 0;font-size:10px;color:var(--text-tertiary);border-bottom:0.5px solid var(--border-tertiary)}
.time-slot:last-child{border-bottom:none}
.meetings-col{flex:1;position:relative;min-height:540px}
.slot-line{height:60px;border-bottom:0.5px solid var(--border-tertiary);position:relative}
.slot-line:last-child{border-bottom:none}
.meeting-block{position:absolute;left:6px;right:6px;border-radius:6px;padding:5px 8px;cursor:pointer;transition:opacity 0.15s;overflow:hidden;z-index:10}
.meeting-block:hover{opacity:0.85;z-index:20}
.mb-korea{background:#E1F5EE;border:0.5px solid #5DCAA5}
.mb-partner{background:#E6F1FB;border:0.5px solid #85B7EB}
.mb-tbd{background:#F1EFE8;border:0.5px solid #B4B2A9}
.mb-title{font-size:11px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-ko{font-size:10px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mb-ko.has-confirmed{color:#085041;font-weight:600}
.mb-time{font-size:9px;color:var(--text-tertiary);margin-top:1px}
.legend{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary)}
.legend-dot{width:10px;height:10px;border-radius:2px}
.detail-panel{background:var(--bg-primary);border:0.5px solid var(--border-secondary);border-radius:var(--radius-lg);padding:16px;margin-top:12px;display:none}
.detail-panel.open{display:block}
.dp-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.dp-company{font-size:15px;font-weight:600;color:var(--text-primary);flex:1}
.dp-close{background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-secondary);line-height:1}
.dp-meta{font-size:12px;color:var(--text-secondary);margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
.sec-label{font-size:10px;font-weight:600;color:var(--text-secondary);letter-spacing:0.5px;text-transform:uppercase;margin:10px 0 6px}
.ko-grid{display:flex;flex-direction:column;gap:4px}
.ko-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;background:var(--bg-secondary);font-size:12px}
.ko-name{flex:1;color:var(--text-primary);font-weight:600}
.ko-sel{font-size:11px;padding:3px 6px;border-radius:4px;border:0.5px solid var(--border-secondary);background:var(--bg-primary);color:var(--text-primary);cursor:pointer}
.ks-accepted{background:#E1F5EE;color:#085041}
.ks-pending{background:#FAEEDA;color:#633806}
.ks-declined{background:#FCEBEB;color:#A32D2D}
.ks-tbd{background:#F1EFE8;color:#5F5E5A}
.req-note{font-size:11px;color:var(--text-secondary);padding:5px 8px;background:var(--bg-secondary);border-radius:5px;margin-top:4px;line-height:1.5}
.notes-box{width:100%;font-size:12px;padding:7px;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);resize:vertical;min-height:48px;margin-top:4px;font-family:inherit}
.paste-area{width:100%;font-size:11px;padding:8px;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);resize:vertical;min-height:100px;font-family:monospace}
.parse-btn{margin-top:8px;font-size:12px;padding:6px 16px;border-radius:var(--radius-md);border:0.5px solid var(--border-secondary);background:var(--text-primary);color:var(--bg-primary);cursor:pointer}
.parse-result{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:var(--radius-md);background:var(--bg-secondary);color:var(--text-secondary)}
.list-view{display:flex;flex-direction:column;gap:6px}
.lv-card{background:var(--bg-primary);border:0.5px solid var(--border-tertiary);border-radius:var(--radius-lg);padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lv-card:hover{border-color:var(--border-secondary)}
.lv-co{font-size:13px;font-weight:600;color:var(--text-primary);flex:1}
.lv-time{font-size:11px;color:var(--text-secondary);white-space:nowrap}
.lv-ko{font-size:11px;color:var(--text-secondary)}
.lv-ko.has-confirmed{color:#085041;font-weight:600}
.booth-badge{font-size:10px;padding:2px 7px;border-radius:4px;white-space:nowrap}
.bb-korea{background:#E1F5EE;color:#085041}
.bb-partner{background:#E6F1FB;color:#0C447C}
.bb-tbd{background:#F1EFE8;color:#5F5E5A}
.ko-view{display:flex;flex-direction:column;gap:6px}
.ko-card{background:var(--bg-primary);border:0.5px solid var(--border-tertiary);border-radius:var(--radius-lg);padding:11px 14px}
.ko-card-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ko-card-name{font-size:13px;font-weight:600;color:var(--text-primary);flex:1}
.ko-meeting-row{display:flex;align-items:center;gap:8px;font-size:11px;padding:3px 7px;background:var(--bg-secondary);border-radius:5px;margin-bottom:3px;flex-wrap:wrap}
.km-time{color:var(--text-secondary);min-width:95px}
.km-co{flex:1;color:var(--text-primary)}
.ks-badge{font-size:10px;padding:2px 6px;border-radius:4px}
.share-note{font-size:11px;color:var(--text-secondary);background:var(--bg-secondary);padding:8px 10px;border-radius:var(--radius-md);margin-bottom:10px;line-height:1.5}
.empty-msg{text-align:center;padding:1.5rem;font-size:13px;color:var(--text-secondary)}
.edit-form{display:none;margin-top:8px;padding:10px;background:var(--bg-secondary);border-radius:var(--radius-md)}
.edit-form.open{display:block}
.edit-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.edit-row label{font-size:10px;color:var(--text-secondary);display:block;margin-bottom:3px}
.edit-row input,.edit-full input{width:100%;font-size:12px;padding:6px 8px;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary)}
.edit-full{margin-bottom:8px}
.edit-full label{font-size:10px;color:var(--text-secondary);display:block;margin-bottom:3px}
.edit-actions{display:flex;gap:6px;justify-content:flex-end}
.edit-btn{font-size:11px;padding:5px 12px;border-radius:var(--radius-md);border:0.5px solid var(--border-secondary);background:var(--bg-primary);color:var(--text-primary);cursor:pointer}
.edit-btn.primary{background:var(--text-primary);color:var(--bg-primary)}
.reschedule-toggle{font-size:11px;padding:4px 10px;border-radius:var(--radius-md);border:0.5px solid var(--border-secondary);background:var(--bg-primary);color:var(--text-primary);cursor:pointer;margin-top:8px}
@media (max-width:480px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .timetable{font-size:11px}
}
</style>
</head>

<div class="app" id="app">
<div class="topbar">

</div>

  <textarea class="paste-area" id="paste-input" placeholder="여기에 시트 내용을 붙여넣으세요 (탭으로 구분된 형식)..."></textarea>
  <button class="parse-btn" onclick="parseAndUpdate()">업데이트 적용 (전체 공유)</button>
  <div id="parse-result"></div>

</div>
</div>

function timeToMin(t){
  if(!t)return 0;
  t=t.trim();
  const pm=t.toLowerCase().includes('pm');
  const am=t.toLowerCase().includes('am');
  t=t.replace(/[apm]/gi,'').trim();
  let [h,m]=[0,0];
  if(t.includes(':'))[h,m]=t.split(':').map(Number);
  else h=parseInt(t);
  if(pm&&h!==12)h+=12;
  if(am&&h===12)h=0;
  return h*60+(m||0);
}

function renderTimetable(){
  renderDayTabs('day-tabs',selectedDay,'selectDay');
  const dayM=getDayMeetings(selectedDay);
  const tt=document.getElementById('timetable');
  const minStart=TIME_START;

  let timeCols='';
  TIMES.forEach(t=>{ timeCols+=`<div class="time-slot">${t}</div>`; });

  let slotLines='';
  TIMES.forEach(()=>{ slotLines+=`<div class="slot-line"></div>`; });

  let blocks='';
  dayM.forEach(m=>{
    const startMin=timeToMin(m.sched.time_start);
    const endMin=timeToMin(m.sched.time_end);
    const top=((startMin-minStart)/30)*SLOT_H;
    const height=Math.max(((endMin-startMin)/30)*SLOT_H,SLOT_H);
    const cls=m.sched.boothType==='korea'?'mb-korea':m.sched.boothType==='partner'?'mb-partner':'mb-tbd';
    const acceptedKo=m.ko_candidates.filter(k=>getKoStatus(m.id,k)==='accepted');
    const allKo=m.ko_candidates;
    const hasConfirmed=acceptedKo.length>0;
    const koText=hasConfirmed?'✓ '+acceptedKo.join(', '):allKo.length?allKo.slice(0,3).join(', ')+(allKo.length>3?'…':''):'매칭 없음';
    blocks+=`<div class="meeting-block ${cls}" style="top:${top}px;height:${height}px" onclick="openDetail(${m.id})">
      <div class="mb-title">${m.us_company}</div>
      <div class="mb-ko${hasConfirmed?' has-confirmed':''}">${koText}</div>
      <div class="mb-time">${m.sched.time_start}–${m.sched.time_end}</div>
    </div>`;
  });

  tt.innerHTML=`<div class="time-col">${timeCols}</div><div class="meetings-col" style="min-height:${TIMES.length*SLOT_H}px">${slotLines}${blocks}</div>`;
  if(selectedMeetingId) openDetail(selectedMeetingId);
}

async function parseAndUpdate(){
  const raw=document.getElementById('paste-input').value.trim();
  if(!raw){document.getElementById('parse-result').textContent='내용을 붙여넣어 주세요.';return;}
  const rows=raw.split('\n').filter(r=>r.trim());
  let updated=0,added=0;
  rows.forEach(row=>{
    const cols=row.split('\t').map(s=>s.trim());
    if(cols.length<2)return;
    const [company,schedRaw,manager,reqNote,ko1,ko2,ko3,ko4,ko5]=cols;
    if(!company)return;
    const koCandidates=[ko1,ko2,ko3,ko4,ko5].filter(Boolean);
    let date='',ts='',te='',loc='',boothType='tbd';
    if(schedRaw){
      const lines=schedRaw.replace(/"/g,'').split('\n').map(s=>s.trim()).filter(Boolean);
      if(lines[0])date=lines[0].replace(/\/2026/,'').replace(/2026\//,'');
      if(lines[1]){
        const parts=lines[1].split('-').map(s=>s.trim());
        let ts0=parts[0]||'';let te0=parts[1]||'';
        const startMin=timeToMin(ts0);
        ts=`${Math.floor(startMin/60)}:${String(startMin%60).padStart(2,'0')}`;
        const endMin=timeToMin(te0);
        te=`${Math.floor(endMin/60)}:${String(endMin%60).padStart(2,'0')}`;
      }
      if(lines[2]){loc=lines[2];boothType=loc.includes('Korea Pavilion')||loc.includes('한국관')||loc.includes('EX-3735')||loc.includes('EX-3335')||loc.includes('EX-3517')?'korea':loc?'partner':'tbd';}
    }
    const existing=meetings.find(m=>m.us_company.toLowerCase().includes(company.toLowerCase().slice(0,8))||company.toLowerCase().includes(m.us_company.toLowerCase().slice(0,8)));
    if(existing){
      existing.sched={date,time_start:ts,time_end:te,location:loc,boothType};
      existing.manager=manager||existing.manager;
      existing.ko_candidates=koCandidates.length?koCandidates:existing.ko_candidates;
      existing.requested_note=reqNote||existing.requested_note;
      updated++;
    } else {
      meetings.push({id:Date.now()+Math.random(),us_company:company,country:'',manager:manager||'',sched:{date,time_start:ts,time_end:te,location:loc,boothType},requested_note:reqNote||'',ko_candidates:koCandidates,notes:''});
      added++;
    }
  });
  document.getElementById('parse-result').textContent=`완료: ${updated}개 업데이트, ${added}개 신규 추가. 저장 중...`;
  document.getElementById('paste-input').value='';
  await saveData();
  document.getElementById('parse-result').textContent=`완료: ${updated}개 업데이트, ${added}개 신규 추가. 모든 팀원에게 반영됨.`;
  updateStats();renderTimetable();renderList();if(currentTab==='korean')renderKorean();
}

function csvEscape(v){
  if(v==null) v='';
  v=String(v);
  if(v.includes(',')||v.includes('"')||v.includes('\n')){
    v='"'+v.replace(/"/g,'""')+'"';
  }
  return v;
}

    const row=[
      m.us_company, m.country||'', m.sched.date||'', m.sched.time_start||'', m.sched.time_end||'',
      m.sched.location||'', boothLabel[m.sched.boothType]||'', m.manager||'', m.requested_note||'', m.notes||''
    ];
    for(let i=0;i<5;i++){
      const k=m.ko_candidates[i];
      if(k){ row.push(k); row.push(KO_STATUS[getKoStatus(m.id,k)]); }
      else { row.push(''); row.push(''); }
    }
    rows.push(row);
  });
  const csv='\uFEFF'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const today=new Date();
  const dateStr=`${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
  a.href=url; a.download=`BIO2026_schedule_${dateStr}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function updateStats(){
  document.getElementById('s-total').textContent=meetings.filter(m=>m.sched.date).length;
  let acc=0,pend=0,noko=0;
  meetings.forEach(m=>{
    const hasAcc=m.ko_candidates.some(k=>getKoStatus(m.id,k)==='accepted');
    const hasPend=m.ko_candidates.some(k=>getKoStatus(m.id,k)==='pending');
    if(hasAcc)acc++;else if(hasPend)pend++;
    if(m.ko_candidates.length===0)noko++;
  });
  document.getElementById('s-acc').textContent=acc;
  document.getElementById('s-pend').textContent=pend;
  document.getElementById('s-noko').textContent=noko;
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['timetable','list','korean','update'][i]===tab));
  document.getElementById('view-timetable').style.display=tab==='timetable'?'':'none';
  document.getElementById('view-list').style.display=tab==='list'?'':'none';
  document.getElementById('view-korean').style.display=tab==='korean'?'':'none';
  document.getElementById('view-update').style.display=tab==='update'?'':'none';
  if(tab==='list')renderList();
  if(tab==='korean')renderKorean();
}

// ---- Firestore sync ----
async function saveData(){
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-text');
  dot.className='sync-dot syncing';txt.textContent='저장 중...';
  isSaving=true;
  try{
    await docRef.set({
      meetings: JSON.stringify(meetings),
      koStatus: JSON.stringify(koStatus),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    dot.className='sync-dot';txt.textContent='동기화됨';
  }catch(e){
    dot.className='sync-dot error';txt.textContent='저장 실패: '+e.message;
    console.error('Save error:',e);
  }
  isSaving=false;
}

function applyRemoteData(data){
  try{
    meetings = data.meetings ? JSON.parse(data.meetings) : JSON.parse(JSON.stringify(DEFAULT_MEETINGS));
  }catch(e){ meetings = JSON.parse(JSON.stringify(DEFAULT_MEETINGS)); }
  try{
    koStatus = data.koStatus ? JSON.parse(data.koStatus) : {};
  }catch(e){ koStatus = {}; }
  renderTimetable();
  updateStats();
  if(currentTab==='list')renderList();
  if(currentTab==='korean')renderKorean();
}

// Real-time listener: any team member's update reflects here automatically
docRef.onSnapshot((snap)=>{
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-text');
  // Don't disrupt UI if we're actively typing in a textarea
  const activeIsTextarea = document.activeElement && document.activeElement.tagName==='TEXTAREA';
  if(!snap.exists){
    // first run: seed with defaults
    meetings = JSON.parse(JSON.stringify(DEFAULT_MEETINGS));
    koStatus = {};
    docRef.set({meetings:JSON.stringify(meetings), koStatus:JSON.stringify(koStatus), updatedAt: firebase.firestore.FieldValue.serverTimestamp()})
      .then(()=>{ dot.className='sync-dot';txt.textContent='동기화됨'; renderTimetable(); updateStats(); });
    return;
  }
  const data=snap.data();
  if(!activeIsTextarea){
    applyRemoteData(data);
  }
  dot.className='sync-dot';txt.textContent='동기화됨';
},(err)=>{
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-text');
  dot.className='sync-dot error';txt.textContent='연결 실패: '+err.message;
  console.error('Firestore error:',err);
  // fallback to defaults so the page is still usable
  meetings = JSON.parse(JSON.stringify(DEFAULT_MEETINGS));
  koStatus = {};
  renderTimetable();
  updateStats();
});
</script>
